<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — Cuby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0d0b14; --panel: #171320; --panel-2: #1d1829; --edge: #2a2438;
    --ink: #ece9f7; --muted: #8b85a3; --primary: #7c5cff; --primary-deep: #5b3ddb;
    --gold: #f5b94d; --green: #4fd18a;
  }
  [data-theme="blue"]{ --primary:#2f8fd1; --primary-deep:#1f6fa8; }
  [data-theme="green"]{ --primary:#37b673; --primary-deep:#1f8a54; }
  [data-theme="orange"]{ --primary:#ff8c42; --primary-deep:#e5722a; }
  [data-theme="crimson"]{ --primary:#e5484d; --primary-deep:#b23237; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--bg); color:var(--ink); font-family:'Nunito',sans-serif; display:flex; min-height:100vh; }
  a{ color:inherit; text-decoration:none; }
  h1,h2,h3{ font-family:'Baloo 2',sans-serif; }

  .sidebar{ width:220px; background:var(--panel); border-right:1px solid var(--edge); padding:1.4rem 1rem; display:flex; flex-direction:column; gap:1.8rem; position:sticky; top:0; height:100vh; }
  .logo{ display:flex; align-items:center; gap:0.6rem; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:1.35rem; padding:0 0.4rem; }
  .logo .cube{ width:28px; height:28px; border-radius:8px; background:linear-gradient(150deg, var(--primary), var(--primary-deep)); box-shadow:0 4px 14px rgba(124,92,255,0.4), 0 0 0 4px rgba(124,92,255,0.08); animation:pulse-glow 3s ease-in-out infinite; }
  @keyframes pulse-glow{ 0%,100%{ box-shadow:0 4px 14px rgba(124,92,255,0.4), 0 0 0 4px rgba(124,92,255,0.08); } 50%{ box-shadow:0 4px 18px rgba(124,92,255,0.6), 0 0 0 7px rgba(124,92,255,0.05); } }
  .nav-group{ display:flex; flex-direction:column; gap:0.2rem; }
  .nav-label{ font-size:0.68rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); font-weight:800; padding:0 0.7rem; margin-bottom:0.4rem; }
  .nav-item{ display:flex; align-items:center; gap:0.7rem; padding:0.65rem 0.7rem; border-radius:10px; font-weight:700; font-size:0.9rem; color:var(--muted); transition:background .15s, color .15s; }
  .nav-item .ic{ font-size:1.05rem; width:20px; text-align:center; flex-shrink:0; filter:grayscale(1) opacity(0.65); transition:filter .15s; }
  .nav-item:hover{ background:var(--panel-2); color:var(--ink); }
  .nav-item.active{ background:linear-gradient(90deg, rgba(124,92,255,0.18), transparent); color:var(--ink); border:1px solid var(--edge); }
  .nav-item.active .ic{ filter:none; }
  .sidebar-footer{ margin-top:auto; display:flex; align-items:center; gap:0.7rem; padding:0.7rem; border-radius:10px; background:var(--panel-2); border:1px solid var(--edge); }
  .sidebar-footer .av{ width:34px; height:34px; border-radius:50%; background:linear-gradient(150deg,var(--primary),var(--primary-deep)); flex-shrink:0; }
  .sidebar-footer .name{ font-weight:800; font-size:0.85rem; }
  .sidebar-footer .sub{ font-size:0.72rem; color:var(--muted); }

  .main{ flex:1; }
  .content{ padding:2.4rem 1.8rem 4rem; max-width:760px; position:relative; }
  .content::before{ content:''; position:absolute; top:-60px; right:-60px; width:280px; height:280px; background:radial-gradient(circle, var(--primary) 0%, transparent 70%); opacity:0.16; filter:blur(50px); pointer-events:none; z-index:0; }
  .content > *{ position:relative; z-index:1; }
  .page-head{ margin-bottom:2rem; }
  .page-head .eyebrow{ font-size:0.78rem; color:var(--primary); font-weight:800; letter-spacing:0.05em; text-transform:uppercase; }
  .page-head h1{ font-size:2rem; margin-top:0.4rem; }

  .settings-block{ background:var(--panel); border:1px solid var(--edge); border-top:3px solid var(--primary); border-radius:16px; padding:1.8rem; box-shadow:0 24px 50px -28px rgba(0,0,0,0.6); }
  .settings-block h3{ font-size:1.1rem; margin-bottom:0.4rem; }
  .settings-block > p{ color:var(--muted); font-size:0.85rem; margin-bottom:1.4rem; }

  .theme-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(120px,1fr)); gap:0.9rem; }
  .theme-option{
    background:var(--panel-2); border:2px solid var(--edge); border-radius:12px; padding:1rem;
    cursor:pointer; text-align:center; transition:border-color .15s, transform .15s;
  }
  .theme-option:hover{ transform:translateY(-2px); }
  .theme-option.selected{ border-color:var(--swatch); }
  .swatch{
    width:100%; height:44px; border-radius:8px; margin-bottom:0.6rem;
    background:linear-gradient(150deg, var(--swatch), var(--swatch-deep));
  }
  .theme-name{ font-weight:700; font-size:0.82rem; }

  footer{ text-align:center; padding:2rem; color:var(--muted); font-size:0.8rem; font-weight:700; }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="logo"><span class="cube"></span>Cuby</div>
  <div class="nav-group">
    <div class="nav-label">Play</div>
    <a class="nav-item" href="index.html"><span class="ic">🏠</span>Home</a>
    <a class="nav-item" href="games.html"><span class="ic">🎮</span>Games</a>
    <a class="nav-item" href="download.html"><span class="ic">⬇️</span>Download</a>
    <a class="nav-item active" href="settings.html"><span class="ic">⚙️</span>Settings</a>
  </div>
  <div class="sidebar-footer">
    <span class="av"></span>
    <div><div class="name">Guest</div><div class="sub">Not signed in</div></div>
  </div>
</aside>

<div class="main">
  <div class="content">
    <div class="page-head">
      <span class="eyebrow">Settings</span>
      <h1>Make it yours</h1>
    </div>

    <div class="settings-block">
      <h3>Theme</h3>
      <p>Pick an accent color for Cuby. This changes the whole site, not just this page.</p>
      <div class="theme-grid" id="themeGrid">
        <div class="theme-option" data-theme-value="indigo" style="--swatch:#7c5cff; --swatch-deep:#5b3ddb;">
          <div class="swatch"></div><div class="theme-name">Indigo</div>
        </div>
        <div class="theme-option" data-theme-value="blue" style="--swatch:#2f8fd1; --swatch-deep:#1f6fa8;">
          <div class="swatch"></div><div class="theme-name">Blue</div>
        </div>
        <div class="theme-option" data-theme-value="green" style="--swatch:#37b673; --swatch-deep:#1f8a54;">
          <div class="swatch"></div><div class="theme-name">Green</div>
        </div>
        <div class="theme-option" data-theme-value="orange" style="--swatch:#ff8c42; --swatch-deep:#e5722a;">
          <div class="swatch"></div><div class="theme-name">Orange</div>
        </div>
        <div class="theme-option" data-theme-value="crimson" style="--swatch:#e5484d; --swatch-deep:#b23237;">
          <div class="swatch"></div><div class="theme-name">Crimson</div>
        </div>
      </div>
    </div>
  </div>

  <footer>© <span id="year"></span> Cuby — built by immortalslayer</footer>
</div>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  const params = new URLSearchParams(location.search);
  let currentTheme = params.get('theme') || 'indigo';
  if(currentTheme !== 'indigo') document.documentElement.setAttribute('data-theme', currentTheme);

  const options = document.querySelectorAll('.theme-option');
  function markSelected(){
    options.forEach(opt=>{
      opt.classList.toggle('selected', opt.dataset.themeValue === currentTheme);
    });
  }
  markSelected();

  options.forEach(opt=>{
    opt.addEventListener('click', ()=>{
      currentTheme = opt.dataset.themeValue;
      if(currentTheme === 'indigo'){
        document.documentElement.removeAttribute('data-theme');
      } else {
        document.documentElement.setAttribute('data-theme', currentTheme);
      }
      markSelected();
      updateNavLinks();
    });
  });

  function updateNavLinks(){
    document.querySelectorAll('a[href$=".html"]').forEach(a=>{
      const base = a.getAttribute('href').split('?')[0];
      a.href = currentTheme !== 'indigo' ? base + '?theme=' + currentTheme : base;
    });
  }
  updateNavLinks();
</script>

</body>
</html>
