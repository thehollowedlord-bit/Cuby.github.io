<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Cuby</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0d0b14; --panel: #171320; --panel-2: #1d1829; --edge: #2a2438;
    --ink: #ece9f7; --muted: #8b85a3; --primary: #37b673; --primary-deep: #1f8a54;
    --gold: #f5b94d; --green: #4fd18a;
  }



  [data-mode="light"]{
    --bg:#f3f5fa; --panel:#ffffff; --panel-2:#eef1f7; --edge:#dde3ee;
    --ink:#20242c; --muted:#6b7280;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--ink); font-family:'Nunito',sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem;
  }
  a{ color:inherit; }
  h1,h2{ font-family:'Titan One',cursive; font-weight:400; }

  .auth-card{
    width:100%; max-width:400px; background:var(--panel); border:3px solid var(--edge);
    border-radius:8px; padding:2rem; box-shadow:6px 6px 0 rgba(0,0,0,0.25);
  }
  .logo{ display:flex; align-items:center; gap:0.6rem; justify-content:center; margin-bottom:1.6rem; }
  .logo svg{ width:30px; height:30px; }
  .logo span{ font-family:'Titan One',cursive; font-size:1.5rem; }

  .tabs{ display:flex; gap:0.5rem; margin-bottom:1.6rem; background:var(--panel-2); border:2px solid var(--edge); border-radius:6px; padding:4px; }
  .tab{
    flex:1; text-align:center; padding:0.6rem; border-radius:4px; font-weight:800; font-size:0.88rem;
    cursor:pointer; color:var(--muted); transition:background .15s, color .15s;
  }
  .tab.active{ background:var(--primary); color:#fff; }

  form{ display:none; flex-direction:column; gap:1rem; }
  form.active{ display:flex; }

  label{ font-size:0.8rem; font-weight:800; color:var(--muted); margin-bottom:0.35rem; display:block; }
  input{
    width:100%; padding:0.75rem 0.9rem; border-radius:5px; border:2px solid var(--edge);
    background:var(--panel-2); color:var(--ink); font-family:'Nunito',sans-serif; font-size:0.9rem;
  }
  input:focus{ outline:none; border-color:var(--primary); }

  .btn{
    margin-top:0.4rem; padding:0.85rem; border-radius:6px; border:3px solid #000;
    background:linear-gradient(150deg,var(--primary),var(--primary-deep)); color:#fff;
    font-family:'Nunito',sans-serif; font-weight:800; font-size:0.92rem; cursor:pointer;
    box-shadow:3px 3px 0 rgba(0,0,0,0.35); transition:transform .1s;
  }
  .btn:hover{ transform:translate(1px,1px); box-shadow:1px 1px 0 rgba(0,0,0,0.35); }

  .notice{
    margin-top:1.2rem; font-size:0.76rem; color:var(--muted); text-align:center; line-height:1.5;
  }
  .back-link{ display:block; text-align:center; margin-top:1.2rem; font-size:0.82rem; color:var(--muted); text-decoration:none; }
  .back-link:hover{ color:var(--primary); }
</style>
</head>
<body>

<div class="auth-card">
  <div class="logo">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 34 L50 16 L88 34 L88 74 L50 92 L12 74 Z" stroke="var(--primary)" stroke-width="7" stroke-linejoin="round" fill="none"/>
      <path d="M12 34 L50 52 L88 34 M50 52 L50 92" stroke="var(--primary)" stroke-width="7" stroke-linejoin="round" fill="none"/>
    </svg>
    <span>Cuby</span>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="login">Log In</div>
    <div class="tab" data-tab="signup">Sign Up</div>
  </div>

  <form id="loginForm" class="active">
    <div>
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" placeholder="you@example.com" required>
    </div>
    <div>
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn">Log In</button>
  </form>

  <form id="signupForm">
    <div>
      <label for="signupEmail">Email</label>
      <input type="email" id="signupEmail" placeholder="you@example.com" required>
    </div>
    <div>
      <label for="signupUsername">Username</label>
      <input type="text" id="signupUsername" placeholder="CoolBuilder123" required>
    </div>
    <div>
      <label for="signupAge">Age</label>
      <input type="number" id="signupAge" placeholder="13" min="1" max="120" required>
    </div>
    <div>
      <label for="signupPassword">Password</label>
      <input type="password" id="signupPassword" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn">Create Account</button>
  </form>

  <p class="notice" id="statusMsg"></p>

  <a href="index.html" class="back-link">← Back to Cuby</a>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    sendEmailVerification,
    updateProfile
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCphf9Jj6usKWrRh5LC3kQakuNMcx6dSRE",
    authDomain: "cuby-48249.firebaseapp.com",
    projectId: "cuby-48249",
    storageBucket: "cuby-48249.firebasestorage.app",
    messagingSenderId: "204506566879",
    appId: "1:204506566879:web:8479f9b254ffc5d966196a"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const tabs = document.querySelectorAll('.tab');
  const forms = { login: document.getElementById('loginForm'), signup: document.getElementById('signupForm') };
  const statusMsg = document.getElementById('statusMsg');

  tabs.forEach(tab=>{
    tab.addEventListener('click', ()=>{
      tabs.forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      Object.values(forms).forEach(f=>f.classList.remove('active'));
      forms[tab.dataset.tab].classList.add('active');
      statusMsg.textContent = '';
    });
  });

  function friendlyError(code){
    const map = {
      'auth/email-already-in-use': 'That email is already registered.',
      'auth/invalid-email': 'That email address looks invalid.',
      'auth/weak-password': 'Password should be at least 6 characters.',
      'auth/user-not-found': 'No account found with that email.',
      'auth/wrong-password': 'Incorrect password.',
      'auth/invalid-credential': 'Incorrect email or password.',
      'auth/too-many-requests': 'Too many attempts. Try again in a bit.'
    };
    return map[code] || 'Something went wrong. Please try again.';
  }

  document.getElementById('signupForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const email = document.getElementById('signupEmail').value;
    const username = document.getElementById('signupUsername').value;
    const age = parseInt(document.getElementById('signupAge').value, 10);
    const password = document.getElementById('signupPassword').value;

    if(!age || age < 13){
      statusMsg.style.color = '#e5484d';
      statusMsg.textContent = 'You must be 13 or older to create a Cuby account.';
      return;
    }

    statusMsg.style.color = 'var(--muted)';
    statusMsg.textContent = 'Creating your account...';

    try{
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await updateProfile(cred.user, { displayName: username });
      await sendEmailVerification(cred.user);
      statusMsg.style.color = 'var(--green)';
      statusMsg.textContent = 'Account created! Check ' + email + ' for a verification link.';
    }catch(err){
      statusMsg.style.color = '#e5484d';
      statusMsg.textContent = friendlyError(err.code);
    }
  });

  document.getElementById('loginForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;

    statusMsg.style.color = 'var(--muted)';
    statusMsg.textContent = 'Logging in...';

    try{
      const cred = await signInWithEmailAndPassword(auth, email, password);
      if(!cred.user.emailVerified){
        statusMsg.style.color = 'var(--gold)';
        statusMsg.textContent = 'Please verify your email first — check your inbox for the link.';
        return;
      }
      statusMsg.style.color = 'var(--green)';
      statusMsg.textContent = 'Welcome back, ' + (cred.user.displayName || 'Player') + '!';
      setTimeout(()=>{ location.href = 'index.html' + location.search; }, 1200);
    }catch(err){
      statusMsg.style.color = '#e5484d';
      statusMsg.textContent = friendlyError(err.code);
    }
  });

  const savedMode = localStorage.getItem('cubyMode');
  const params = new URLSearchParams(location.search);
  const mode = savedMode || params.get('mode') || 'dark';
  if(mode === 'light') document.documentElement.setAttribute('data-mode', 'light');
</script>

</body>
</html>
