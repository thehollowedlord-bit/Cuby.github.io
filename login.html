<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Cuby</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0d0b14; --panel: #171320; --panel-2: #1d1829; --edge: #2a2438;
    --ink: #ece9f7; --muted: #8b85a3; --primary: #7c5cff; --primary-deep: #5b3ddb;
    --gold: #f5b94d; --green: #4fd18a;
  }
  [data-theme="blue"]{ --primary:#2f8fd1; --primary-deep:#1f6fa8; }
  [data-theme="green"]{ --primary:#37b673; --primary-deep:#1f8a54; }
  [data-theme="orange"]{ --primary:#ff8c42; --primary-deep:#e5722a; }
  [data-theme="crimson"]{ --primary:#e5484d; --primary-deep:#b23237; }
  [data-mode="light"]{
    --bg:#f3f5fa; --panel:#ffffff; --panel-2:#eef1f7; --edge:#dde3ee;
    --ink:#20242c; --muted:#6b7280;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--ink); font-family:'Nunito',sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem;
  }
  a{ color:inherit; }
  h1,h2{ font-family:'Titan One',cursive; font-weight:400; }

  .auth-card{
    width:100%; max-width:400px; background:var(--panel); border:3px solid var(--edge);
    border-radius:8px; padding:2rem; box-shadow:6px 6px 0 rgba(0,0,0,0.25);
  }
  .logo{ display:flex; align-items:center; gap:0.6rem; justify-content:center; margin-bottom:1.6rem; }
  .logo svg{ width:30px; height:30px; }
  .logo span{ font-family:'Titan One',cursive; font-size:1.5rem; }

  .tabs{ display:flex; gap:0.5rem; margin-bottom:1.6rem; background:var(--panel-2); border:2px solid var(--edge); border-radius:6px; padding:4px; }
  .tab{
    flex:1; text-align:center; padding:0.6rem; border-radius:4px; font-weight:800; font-size:0.88rem;
    cursor:pointer; color:var(--muted); transition:background .15s, color .15s;
  }
  .tab.active{ background:var(--primary); color:#fff; }

  form{ display:none; flex-direction:column; gap:1rem; }
  form.active{ display:flex; }

  label{ font-size:0.8rem; font-weight:800; color:var(--muted); margin-bottom:0.35rem; display:block; }
  input{
    width:100%; padding:0.75rem 0.9rem; border-radius:5px; border:2px solid var(--edge);
    background:var(--panel-2); color:var(--ink); font-family:'Nunito',sans-serif; font-size:0.9rem;
  }
  input:focus{ outline:none; border-color:var(--primary); }

  .btn{
    margin-top:0.4rem; padding:0.85rem; border-radius:6px; border:3px solid #000;
    background:linear-gradient(150deg,var(--primary),var(--primary-deep)); color:#fff;
    font-family:'Nunito',sans-serif; font-weight:800; font-size:0.92rem; cursor:pointer;
    box-shadow:3px 3px 0 rgba(0,0,0,0.35); transition:transform .1s;
  }
  .btn:hover{ transform:translate(1px,1px); box-shadow:1px 1px 0 rgba(0,0,0,0.35); }

  .notice{
    margin-top:1.2rem; font-size:0.76rem; color:var(--muted); text-align:center; line-height:1.5;
  }
  .back-link{ display:block; text-align:center; margin-top:1.2rem; font-size:0.82rem; color:var(--muted); text-decoration:none; }
  .back-link:hover{ color:var(--primary); }
</style>
</head>
<body>

<div class="auth-card">
  <div class="logo">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 34 L50 16 L88 34 L88 74 L50 92 L12 74 Z" stroke="var(--primary)" stroke-width="7" stroke-linejoin="round" fill="none"/>
      <path d="M12 34 L50 52 L88 34 M50 52 L50 92" stroke="var(--primary)" stroke-width="7" stroke-linejoin="round" fill="none"/>
    </svg>
    <span>Cuby</span>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="login">Log In</div>
    <div class="tab" data-tab="signup">Sign Up</div>
  </div>

  <form id="loginForm" class="active">
    <div>
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" placeholder="you@example.com" required>
    </div>
    <div>
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn">Log In</button>
  </form>

  <form id="signupForm">
    <div>
      <label for="signupEmail">Email</label>
      <input type="email" id="signupEmail" placeholder="you@example.com" required>
    </div>
    <div>
      <label for="signupUsername">Username</label>
      <input type="text" id="signupUsername" placeholder="CoolBuilder123" required>
    </div>
    <div>
      <label for="signupPassword">Password</label>
      <input type="password" id="signupPassword" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn">Create Account</button>
  </form>

  <p class="notice" id="statusMsg"></p>

  <a href="index.html" class="back-link">← Back to Cuby</a>
</div>

<script>
  const tabs = document.querySelectorAll('.tab');
  const forms = { login: document.getElementById('loginForm'), signup: document.getElementById('signupForm') };
  const statusMsg = document.getElementById('statusMsg');

  tabs.forEach(tab=>{
    tab.addEventListener('click', ()=>{
      tabs.forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      Object.values(forms).forEach(f=>f.classList.remove('active'));
      forms[tab.dataset.tab].classList.add('active');
      statusMsg.textContent = '';
    });
  });

  document.getElementById('loginForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    statusMsg.textContent = 'Accounts aren\\'t connected yet — this form is a preview.';
  });

  document.getElementById('signupForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    statusMsg.textContent = 'Accounts aren\\'t connected yet — this form is a preview.';
  });

  const theme = new URLSearchParams(location.search).get('theme') || 'indigo';
  const mode = new URLSearchParams(location.search).get('mode') || 'dark';
  if(theme !== 'indigo') document.documentElement.setAttribute('data-theme', theme);
  if(mode === 'light') document.documentElement.setAttribute('data-mode', 'light');
</script>

</body>
</html>
